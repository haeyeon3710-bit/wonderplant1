<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><title>고난도 치료, 꼼꼼한 계획부터</title><rect width="1200" height="800" rx="30" fill="#f2f5ff"/><rect x="0" y="0" width="1200" height="210" fill="#233879"/><text x="64" y="65" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#d0ddff" letter-spacing="3">WONDERFUL DENTAL CLINIC</text><text x="64" y="139" font-family="Malgun Gothic,sans-serif" font-size="42" font-weight="700" fill="white">고난도 치료, 꼼꼼한 계획부터</text><rect x="55" y="245" width="1090" height="88" rx="18" fill="white" stroke="#d6def4"/><circle cx="104" cy="289" r="23" fill="#e8f0ff"/><text x="104" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#304a9d">1</text><text x="149" y="300" font-family="Malgun Gothic,sans-serif" font-size="31" fill="#233879">고난도 임플란트 진료 분야</text><rect x="55" y="356" width="1090" height="88" rx="18" fill="white" stroke="#d6def4"/><circle cx="104" cy="400" r="23" fill="#e8f0ff"/><text x="104" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#304a9d">2</text><text x="149" y="411" font-family="Malgun Gothic,sans-serif" font-size="31" fill="#233879">구강 상태와 전신 건강을 함께 평가</text><rect x="55" y="467" width="1090" height="88" rx="18" fill="white" stroke="#d6def4"/><circle cx="104" cy="511" r="23" fill="#e8f0ff"/><text x="104" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#304a9d">3</text><text x="149" y="522" font-family="Malgun Gothic,sans-serif" font-size="31" fill="#233879">필요한 과정과 대안을 설명</text><rect x="55" y="578" width="1090" height="88" rx="18" fill="white" stroke="#d6def4"/><circle cx="104" cy="622" r="23" fill="#e8f0ff"/><text x="104" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#304a9d">4</text><text x="149" y="633" font-family="Malgun Gothic,sans-serif" font-size="31" fill="#233879">개별 수술 가능 여부는 진료 후 판단</text><text x="64" y="756" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#677593">원더플치과의원 · 치료 계획과 적용 여부는 개인 상태에 따라 달라집니다</text></svg>